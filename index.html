<!doctype html>
<html lang="zh-CN">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta charset="utf-8">
<title>塞行李箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 卧室木地板上摊着一只打开的行李箱，床单上是要带的东西。暖光、薄荷绿的箱子。外观固定，不跟系统深色走 */
:root{
  color-scheme:light;
  --ink:#33302e;
  --soft:#7a716a;
  --mint:#5fc7a8;
  --mint-d:#3b9c80;
  --coral:#ff7a6b;
  --card:#fffaf3;
  --line:rgba(60,40,30,.14);
  --font-title:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{overflow:hidden;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;touch-action:none;-webkit-user-select:none;user-select:none;background:#b98a5e}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:0;top:0;width:420px;height:740px;transform-origin:0 0;pointer-events:none}
#hud > *{pointer-events:auto}
.bar{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:8px;pointer-events:none}
.bar > *{pointer-events:auto}
.chip{padding:4px 12px;border-radius:999px;background:rgba(255,250,243,.92);box-shadow:0 3px 10px rgba(60,30,10,.18);font-weight:700;font-size:14px;white-space:nowrap}
.chip b{font-family:var(--font-num);font-size:17px}
.grow{flex:1}
.ibtn{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,250,243,.92);box-shadow:0 3px 10px rgba(60,30,10,.18);font-size:15px;display:grid;place-items:center}
.tools{position:absolute;display:flex;gap:6px;transform:translate(-50%,-100%);transition:opacity .15s}
.tools button{border:0;border-radius:999px;padding:7px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;box-shadow:0 6px 14px rgba(0,0,0,.25);white-space:nowrap}
.tools button.fold{background:var(--coral)}
.close{position:absolute;left:50%;top:0;transform:translateX(-50%);border:0;border-radius:999px;padding:11px 26px;font-weight:900;font-size:17px;background:var(--mint);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 8px 18px rgba(40,120,100,.35);white-space:nowrap}
.close:disabled{background:#c9c2bb;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-6px);opacity:0;padding:7px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

#home,#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#home{background:radial-gradient(120% 80% at 50% 0%,#f3d9b8 0%,#d8a878 55%,#a8784e 100%)}
#modal{background:rgba(50,30,20,.45)}
.card{width:min(380px,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:24px;background:var(--card);box-shadow:0 24px 60px rgba(40,20,10,.35);padding:22px 18px 18px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(14px) scale(.95);opacity:0}}
.logo{margin:0;font-family:var(--font-title);font-weight:400;font-size:52px;line-height:1.05;color:var(--mint-d);text-shadow:0 3px 0 #fff}
.card h2{margin:0;font-family:var(--font-title);font-weight:400;font-size:30px}
.card p{margin:0}
.card .small{font-size:12px;color:var(--soft)}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lv{border:0;border-radius:16px;padding:10px 8px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);text-align:center}
.lv b{display:block;font-family:var(--font-title);font-weight:400;font-size:18px}
.lv span{font-size:12px;color:var(--soft)}
.lv.done{box-shadow:inset 0 0 0 2px var(--mint)}
.lv:disabled{opacity:.45}
.lv.daily{grid-column:1/-1;background:linear-gradient(135deg,#fff3e6,#ffe0d6)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:900;font-size:16px;background:var(--mint);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 8px 18px rgba(40,120,100,.3)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:active{transform:translateY(2px)}
.row{display:flex;gap:8px}
.row > *{flex:1}
.big{font-family:var(--font-num);font-weight:800;font-size:52px;line-height:1;color:var(--mint-d)}
.how{margin:0;padding-left:1.2em;text-align:left;font-size:14px;display:flex;flex-direction:column;gap:5px}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="bar">
      <button class="ibtn" id="btnBack" type="button" aria-label="选关">☰</button>
      <span class="chip" id="lvName"></span>
      <span class="grow"></span>
      <span class="chip">⏱ <b id="time">0:00</b></span>
      <button class="ibtn" id="btnSound" type="button" aria-label="声音">🔊</button>
    </div>
    <div class="tools" id="tools" hidden><button type="button" id="tRot">↻ 转一下</button><button type="button" class="fold" id="tFold">叠起来</button></div>
    <button class="close" id="btnClose" type="button" disabled>合上箱子</button>
    <div class="toast" id="toast"></div>
  </div>
</div>
<section id="home"><div class="card" id="homeCard"></div></section>
<div id="modal" hidden></div>

<!--BOARD 五个小游戏共用的每日排行榜（tools/board.html，用 tools/embed-board.mjs 塞进各个游戏）-->
<style>
.mb-wrap{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,25,20,.5);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#33302e;-webkit-user-select:none;user-select:none}
.mb-card{width:min(380px,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:24px;background:#fffaf3;box-shadow:0 24px 60px rgba(40,20,10,.35);padding:22px 18px 18px;display:flex;flex-direction:column;gap:10px;text-align:center;animation:mb-pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mb-pop{from{transform:translateY(14px) scale(.95);opacity:0}}
.mb-card h2{margin:0;font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;font-weight:400;font-size:28px;line-height:1.2}
.mb-sub{margin:0;font-size:12px;color:#7a716a}
.mb-tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:#f1e8dc;align-self:center}
.mb-tabs button{border:0;border-radius:999px;padding:6px 14px;background:transparent;font:inherit;font-weight:700;font-size:13px;color:#7a716a;cursor:pointer}
.mb-tabs button.on{background:#fff;color:#33302e;box-shadow:0 2px 6px rgba(60,30,10,.12)}
.mb-mine{margin:0;font-size:14px;font-weight:700;color:#3b9c80;min-height:1.4em}
.mb-list{display:flex;flex-direction:column;gap:6px;min-height:110px;max-height:50vh;overflow:auto;margin:0 -4px;padding:2px 4px;text-align:left}
.mb-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(60,40,30,.12)}
.mb-row.me{background:#e6f7f1;box-shadow:inset 0 0 0 2px #5fc7a8}
.mb-rk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:"Baloo 2","Noto Sans SC",sans-serif;font-weight:800;font-size:14px;color:#7a716a}
.mb-rk.g1{background:#ffd54f;color:#7a5200}.mb-rk.g2{background:#dfe3e8;color:#4a5560}.mb-rk.g3{background:#f1c39a;color:#7a3f12}
.mb-nm{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-sc{flex:none;max-width:52%;text-align:right;font-size:12px;color:#7a716a;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-sc b{display:block;font-family:"Baloo 2","Noto Sans SC",sans-serif;font-weight:800;font-size:15px;color:#33302e}
.mb-note{margin:0;padding:18px 0;text-align:center;font-size:13px;color:#7a716a}
.mb-row2{display:flex;gap:8px}
.mb-row2 > *{flex:1}
.mb-btn{border:0;border-radius:14px;padding:11px 10px;font:inherit;font-weight:900;font-size:15px;cursor:pointer;background:#fff;color:#33302e;box-shadow:inset 0 0 0 1.5px rgba(60,40,30,.14);-webkit-tap-highlight-color:transparent}
.mb-btn.main{background:#5fc7a8;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 8px 18px rgba(40,120,100,.3)}
.mb-btn:active{transform:translateY(2px)}
.mb-input{width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:17px;font-weight:700;color:#33302e;background:#fff;box-shadow:inset 0 0 0 2px rgba(60,40,30,.14);outline:none;-webkit-user-select:text;user-select:text}
.mb-input:focus{box-shadow:inset 0 0 0 2px #5fc7a8}
.mb-err{min-height:1.2em;margin:0;font-size:12px;color:#ff7a6b}
</style>
<script>
window.MiniBoard = (() => {
'use strict';
// Supabase 项目的地址和公开 key（公开 key 本来就是给网页用的，能读榜、能交成绩，改不了别人的）
const URL0 = 'https://ghjrmmqnajguwkfoplgo.supabase.co', KEY = 'sb_publishable_1YWUN4fZ3c_TjQD9p6Lmlg_K-vDB6y_';
const PREVIEW = !!window.claude || /(^|\.)claude(usercontent)?\.(ai|com)$/.test(location.hostname);
const store = {
  get(k, d){ try { const v = localStorage.getItem('mini:' + k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } },
  set(k, v){ try { localStorage.setItem('mini:' + k, JSON.stringify(v)); } catch (e){} }
};
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
// game：哪个游戏；first：一天只算第一局（否则留当天最好的一局）
let cfg = {game: '', first: false};
const day = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// 每个人一个只存在自己手机上的编号（交成绩、改名用），和一个公开的短标记（榜上认出自己用）；五个游戏共用一个名字
function me(){
  let m = store.get('me', null);
  if (!m){
    const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
    const h = hex(16);
    m = {pid: `${h.slice(0, 8)}-${h.slice(8, 12)}-4${h.slice(13, 16)}-a${h.slice(17, 20)}-${h.slice(20, 32)}`, tag: hex(4), name: ''};
    store.set('me', m);
  }
  return m;
}
let api = async (path, body) => {
  const headers = {apikey: KEY, 'Content-Type': 'application/json'};
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(URL0 + '/rest/v1/' + path, body ? {method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal} : {headers, signal: ctl.signal});
    if (!r.ok) throw new Error('http ' + r.status);
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  } finally {
    clearTimeout(timer);
  }
};
const pendKey = board => `pend:${cfg.game}:${board}`, sentKey = board => `sent:${cfg.game}:${board}`;
const better = (x, y) => x.a > y.a || (x.a === y.a && (x.b || 0) > (y.b || 0));
// 交成绩：a 越大越好，a 一样比 b；shown 是榜上显示的成绩，extra 是下面一行小字
function submit(board, sc){
  const d = day(), p = store.get(pendKey(board), null), sent = store.get(sentKey(board), null);
  if (cfg.first && ((sent && sent.day === d) || (p && p.day === d))) return;
  if (p && p.day === d && !better(sc, p)) return;
  if (sent && sent.day === d && !better(sc, sent)) return;
  store.set(pendKey(board), {day: d, a: sc.a, b: sc.b || 0, shown: String(sc.shown).slice(0, 40), extra: String(sc.extra || '').slice(0, 60)});
  flush(board).catch(() => {});
}
async function flush(board){
  const p = store.get(pendKey(board), null), m = me();
  if (!p || !m.name || PREVIEW) return null;
  const res = await api('rpc/mini_submit', {p_game: cfg.game, p_board: board, p_day: p.day, p_player: m.pid, p_tag: m.tag, p_name: m.name, p_a: p.a, p_b: p.b, p_shown: p.shown, p_extra: p.extra});
  store.set(pendKey(board), null);
  store.set(sentKey(board), {day: p.day, a: p.a, b: p.b});
  return res;
}
const open = card => { close(); const w = el('div', 'mb-wrap'); w.id = 'mbWrap'; w.appendChild(card); w.addEventListener('click', e => { if (e.target === w) close(); }); document.body.appendChild(w); };
const close = () => { const w = document.getElementById('mbWrap'); if (w) w.remove(); };
// 打开今天的排行榜。o: {title, sub, empty, tabs: [{id, label}]}（有好几张榜的时候上面放一排切换）
async function show(board = '', o = {}){
  const card = el('div', 'mb-card');
  const mine = el('p', 'mb-mine'), list = el('div', 'mb-list');
  card.append(el('h2', '', o.title || '今天的排行榜'), el('p', 'mb-sub', o.sub || ''));
  if (o.tabs){
    const tabs = el('div', 'mb-tabs');
    for (const t of o.tabs){
      const b = el('button', t.id === board ? 'on' : '', t.label);
      b.type = 'button';
      b.addEventListener('click', () => { if (t.id !== board) show(t.id, o); });
      tabs.appendChild(b);
    }
    card.appendChild(tabs);
  }
  card.append(mine, list);
  list.appendChild(el('p', 'mb-note', '正在打开排行榜…'));
  const row = el('div', 'mb-row2');
  const nm = el('button', 'mb-btn', me().name ? '改名字' : '起个名字');
  nm.type = 'button';
  nm.addEventListener('click', () => askName(() => show(board, o)));
  const cl = el('button', 'mb-btn main', '关闭');
  cl.type = 'button';
  cl.addEventListener('click', close);
  row.append(nm, cl);
  card.appendChild(row);
  open(card);
  if (PREVIEW){ list.replaceChildren(el('p', 'mb-note', '预览里连不上排行榜，到网页版看')); return; }
  let res = null;
  try { res = await flush(board); } catch (e){}
  let rows;
  try { rows = await api(`mini_scores?select=tag,name,a,b,shown,extra&game=eq.${cfg.game}&board=eq.${encodeURIComponent(board)}&day=eq.${day()}&order=a.desc,b.desc,updated_at.asc&limit=100`); } catch (e){ if (list.isConnected) list.replaceChildren(el('p', 'mb-note', '排行榜没连上，过一会儿再试')); return; }
  if (!list.isConnected) return;
  const m = me();
  list.replaceChildren();
  if (!rows.length) list.appendChild(el('p', 'mb-note', '今天还没有人上榜，来当第一个'));
  let myRank = 0;
  rows.forEach((r, k) => {
    const isMe = r.tag === m.tag;
    if (isMe) myRank = k + 1;
    const d = el('div', 'mb-row' + (isMe ? ' me' : ''));
    const sc = el('span', 'mb-sc');
    sc.append(el('b', '', r.shown), document.createTextNode(r.extra || ''));
    d.append(el('span', 'mb-rk' + (k < 3 ? ' g' + (k + 1) : ''), String(k + 1)), el('span', 'mb-nm', r.name + (isMe ? '（我）' : '')), sc);
    list.appendChild(d);
  });
  const p = store.get(pendKey(board), null);
  if (myRank) mine.textContent = `你排第 ${myRank} 名，一共 ${rows.length}${rows.length >= 100 ? '+' : ''} 人`;
  else if (res && res.rank) mine.textContent = `你排第 ${res.rank} 名，一共 ${res.total} 人`;
  else if (p && p.day === day()) mine.textContent = m.name ? '成绩还没交上去，过一会儿再打开试试' : '起个名字，今天的成绩就能上榜';
  else if ((store.get(sentKey(board), null) || {}).day === day()) mine.textContent = '你在 100 名以外';
  else mine.textContent = o.empty || '玩一局就能上榜';
  if (myRank) setTimeout(() => list.children[myRank - 1]?.scrollIntoView({block: 'nearest'}), 50);
}
function askName(then){
  const card = el('div', 'mb-card');
  const m = me();
  card.append(el('h2', '', m.name ? '改个名字' : '起个名字上榜'), el('p', 'mb-sub', '排行榜上显示这个名字，最多 12 个字，几个小游戏共用'));
  const input = el('input', 'mb-input');
  input.type = 'text';
  input.maxLength = 12;
  input.placeholder = '比如：小游戏大王';
  input.value = m.name || '';
  input.autocomplete = 'nickname';
  input.enterKeyHint = 'done';
  input.setAttribute('aria-label', '昵称');
  const err = el('p', 'mb-err');
  err.setAttribute('role', 'alert');
  card.append(input, err);
  const ok = () => {
    const name = input.value.trim().slice(0, 12);
    if (!name){ err.textContent = '先起个名字'; input.focus(); return; }
    const renamed = m.name && m.name !== name;
    store.set('me', Object.assign(me(), {name}));
    if (renamed && !PREVIEW) api('rpc/mini_rename', {p_player: m.pid, p_name: name}).catch(() => {});
    then();
  };
  // 回车只算一次：不拦住的话，这一下还会按到下一个弹窗里的按钮
  input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key !== 'Enter' || e.isComposing) return; e.preventDefault(); ok(); });
  const row = el('div', 'mb-row2');
  const skip = el('button', 'mb-btn', m.name ? '不改了' : '先不上榜');
  skip.type = 'button';
  skip.addEventListener('click', m.name ? then : close);
  const go = el('button', 'mb-btn main', '好了');
  go.type = 'button';
  go.addEventListener('click', ok);
  row.append(skip, go);
  card.appendChild(row);
  open(card);
  // 改名的时候旧名字整个选中，直接打字就替换掉
  setTimeout(() => { input.focus(); input.select(); }, 60);
}
const api0 = {init(o){ cfg = Object.assign({first: false}, o); }, submit, show, close, hasName: () => !!me().name};
if (['localhost', '127.0.0.1'].includes(location.hostname)) api0.mock = fn => { api = fn; };
return api0;
})();
</script>

<script>
(async () => {
'use strict';
MiniBoard.init({game: 'saixinglixiang', first: true});
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const TAU = Math.PI * 2;
const store = {
  get(k, d){ try { const v = localStorage.getItem('sxl:' + k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } },
  set(k, v){ try { localStorage.setItem('sxl:' + k, JSON.stringify(v)); } catch (e){} }
};
function seeded(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for (const ch of s){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
let toastT = 0;
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 1600); };
const W = 420, H = 740;

/* ================= 形状 ================= */
const R = (w, h) => { const o = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) o.push([x, y]); return o; };
const norm = cells => { const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1])); return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]); };
const dims = cells => [Math.max(...cells.map(c => c[0])) + 1, Math.max(...cells.map(c => c[1])) + 1];

/* ================= 关卡：先拼出一个刚好装满的摆法，再把衣服摊开打乱 ================= */
const LEVELS = [
  {name: '周末出游', cols: 5, rows: 6, cat: false},
  {name: '出差三天', cols: 6, rows: 6, cat: false},
  {name: '海边度假', cols: 6, rows: 7, cat: true},
  {name: '回老家过年', cols: 6, rows: 8, cat: true, gift: true},
  {name: '毕业旅行', cols: 7, rows: 8, cat: true},
  {name: '搬家', cols: 7, rows: 9, cat: true}

function generate(seed, cols, rows, opts = {}){
  for (let attempt = 0; attempt < 60; attempt++){
    const rnd = seeded(seed + attempt * 7919);
    const grid = Array.from({length: rows}, () => Array(cols).fill(-1));
    const placed = [];
    // 候选：每种东西的每个样子、每个方向
    const kinds = Object.keys(KINDS).filter(k => k !== 'gift' || opts.gift);
    const cand = [];
    for (const k of kinds){
      const K = KINDS[k];
      K.states.forEach((cells, s) => {
        if (K.soft && K.states.length > 1 && s === 0) return;   // 衣服在答案里都是叠过或卷过的
        for (let rot = 0; rot < 4; rot++){ const sh = rotate(cells, rot); if (cand.some(o => o.k === k && o.s === s && JSON.stringify(o.cells) === JSON.stringify(sh))) continue; cand.push({k, s, rot, cells: sh}); }
      });
    }
    let fail = false, steps = 0;
    const used = {};
    const fits = (sh, ox, oy) => sh.every(([x, y]) => { const gx = ox + x, gy = oy + y; return gx >= 0 && gy >= 0 && gx < cols && gy < rows && grid[gy][gx] < 0; });
    function solve(){
      if (++steps > 4000) return false;
      let fx = -1, fy = -1;
      outer: for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (grid[y][x] < 0){ fx = x; fy = y; break outer; }
      if (fx < 0) return true;
      const order = cand.map(o => ({o, w: rnd() * (o.cells.length >= 3 ? 2.2 : o.cells.length === 2 ? 1.2 : .35) / (1 + (used[o.k] || 0) * 1.5)})).sort((a, b) => b.w - a.w);
      for (const {o} of order){
        const [ax, ay] = o.cells[0];
        const ox = fx - ax, oy = fy - ay;
        if (!fits(o.cells, ox, oy)) continue;
        const id = placed.length;
        for (const [x, y] of o.cells) grid[oy + y][ox + x] = id;
        placed.push({...o, gx: ox, gy: oy});
        used[o.k] = (used[o.k] || 0) + 1;
        if (solve()) return true;
        placed.pop(); used[o.k]--;
        for (const [x, y] of o.cells) grid[oy + y][ox + x] = -1;
      }
      return false;
    }
    if (!solve()) continue;
    const softN = placed.filter(p => KINDS[p.k].soft && KINDS[p.k].states.length > 1).length;
    if (softN < Math.min(3, placed.length / 3)) continue;
    if (opts.gift && !placed.some(p => p.k === 'gift')) continue;
    // 出题：衣服都摊开，所有东西随机转个方向
    return placed.map((p, i) => ({id: i, k: p.k, s: KINDS[p.k].soft && KINDS[p.k].states.length > 1 ? 0 : p.s, rot: Math.floor(rnd() * 4), col: SHIRT_COLORS[Math.floor(rnd() * SHIRT_COLORS.length)], place: null, sol: {s: p.s, rot: p.rot, gx: p.gx, gy: p.gy}}));
  }
  return null;
}

    tools.style.top = Math.max(96, r.y - 10) + 'px';
    const f = $('tFold');
    f.hidden = !(K.soft && K.states.length > 1);
    if (!f.hidden){ const nx = (G.sel.s + 1) % K.states.length; f.textContent = K.stateNames[nx] === '摊开' ? '摊开' : K.stateNames[nx] === '压扁' ? '压扁' : K.stateNames[nx] === '卷起' ? '卷起来' : '叠起来'; }
  } else tools.hidden = true;
}
// 转和叠：在箱子里的东西变了形状放不下，就退回床上
function transform(fn){
  const it = G.sel; if (!it) return;
  const before = {s: it.s, rot: it.rot};
  fn(it);
  if (it.place && !canPlace(it, itemCells(it), it.place.gx, it.place.gy)){ it.place = null; toast('这里放不下了，先放回床上'); }
  G.moves++;
  layoutBed();
  Sound.fold();
  updateUi();
}
$('tRot').addEventListener('click', () => transform(it => { it.rot = (it.rot + 1) % 4; }));
$('tFold').addEventListener('click', () => transform(it => { it.s = (it.s + 1) % KINDS[it.k].states.length; }));

/* ================= 操作 ================= */
const P = e => { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H}; };
cv.addEventListener('pointerdown', e => {
  if (!G || G.done) return;
  Sound.unlock();
  const p = P(e), h = hit(p.x, p.y);
  if (h === 'cat'){ shoo(); return; }
  if (!h){ G.sel = null; updateUi(); return; }
  cv.setPointerCapture(e.pointerId);
  const r = itemRect(h), cs = h.place ? CASE.cs : h.bed.cs;
  G.drag = {it: h, sx: p.x, sy: p.y, px: p.x, py: p.y, ox: (p.x - r.x) / cs, oy: (p.y - r.y) / cs, moved: false};
  updateUi();
});
cv.addEventListener('pointermove', e => {
  if (!G || !G.drag) return;
  const p = P(e), d = G.drag;
  d.px = p.x; d.py = p.y;
  if (!d.moved && Math.hypot(p.x - d.sx, p.y - d.sy) > 7){ d.moved = true; G.sel = null; Sound.pick(); updateUi(); }
});
cv.addEventListener('pointerup', () => {
  if (!G || !G.drag) return;
  const d = G.drag, it = d.it;
  G.drag = null;
  if (!d.moved){ G.sel = G.sel === it ? null : it; updateUi(); return; }
  if (d.target && d.target.ok){ it.place = {gx: d.target.gx, gy: d.target.gy}; G.moves++; Sound.drop(); }
  else if (d.py > BED.y - 20){ it.place = null; Sound.drop(); }
  else { Sound.nope(); toast(d.target ? '这里放不下' : '放到箱子里，或者放回床上'); }
  layoutBed();
  G.sel = it;
  updateUi();
});
cv.addEventListener('pointercancel', () => { if (G) G.drag = null; });
function shoo(){ if (!G.cat) return; G.cat.in = false; G.cat.show = true; G.cat.next = G.t + 25 + Math.random() * 15; Sound.meow(); toast('猫被你请出去了'); updateUi(); }
function catTick(){
  if (!G.cat || G.done) return;
  if (!G.cat.in && G.t > G.cat.next){
    const g = occupied(null), spots = [];
    for (let y = 0; y < G.rows - 1; y++) for (let x = 0; x < G.cols - 1; x++) if (!g[y][x] && !g[y][x + 1] && !g[y + 1][x] && !g[y + 1][x + 1]) spots.push([x, y]);
    if (spots.length){ const [x, y] = spots[Math.floor(Math.random() * spots.length)]; G.cat.gx = x; G.cat.gy = y; G.cat.in = true; G.cat.show = false; Sound.meow(); toast('猫跳进箱子里睡觉了，点它让它出去'); }
    else G.cat.next = G.t + 6;
  }
}

/* ================= 一关 ================= */
function startLevel(spec, seed, key){
  G = {spec, key, cols: spec.cols, rows: spec.rows, items: generate(seed, spec.cols, spec.rows, spec), t: 0, moves: 0, sel: null, drag: null, done: false, closing: 0, fx: [], cat: spec.cat ? {in: false, show: true, next: 14 + Math.random() * 8, gx: 0, gy: 0} : null};
  if (!G.items){ toast('这一关没生成出来，换一个'); return; }
  $('home').hidden = true;
  closeModal();
  $('lvName').textContent = spec.name;
  layout();
  updateUi();
}
$('btnClose').addEventListener('click', () => {
  if (!G || G.done || G.items.some(it => !it.place)) return;
  if (G.cat && G.cat.in){ toast('猫还在箱子里！先点它'); Sound.meow(); return; }
  G.done = true; G.sel = null; updateUi();
  G.closing = performance.now();
  Sound.zip();
  setTimeout(win, 1300);
});
function win(){
  for (let k = 0; k < 50; k++) G.fx.push({x: W / 2 + (Math.random() - .5) * 200, y: CASE.y + CASE.h / 2, vx: (Math.random() - .5) * 300, vy: -200 - Math.random() * 200, life: 1.4, c: ['#5fc7a8', '#ff7a6b', '#ffd54f', '#fff'][k % 4], r: Math.random() * TAU});
  Sound.win();
  const sec = Math.round(G.t);
  const rec = store.get('rec:' + G.key, null);
  const best = rec ? Math.min(rec, sec) : sec;
  store.set('rec:' + G.key, best);
  // 排行榜：每日一箱只算今天第一次装完的用时，一样快比谁动得少
  if (G.key.startsWith('daily')) MiniBoard.submit('', {a: -sec, b: -G.moves, shown: fmt(sec), extra: `动了 ${G.moves} 次`});
  const card = el('div', 'card');
  card.append(el('h2', '', '装下了！'), el('div', 'big', fmt(sec)), el('p', 'small', `${G.spec.name} · ${G.items.length} 件东西 · 动了 ${G.moves} 次 · 最快 ${fmt(best)}`));
  const row = el('div', 'row');
  const idx = LEVELS.indexOf(G.spec);
  if (idx >= 0 && idx < LEVELS.length - 1){ const n = el('button', 'btn', '下一关'); n.type = 'button'; n.addEventListener('click', () => startLevel(LEVELS[idx + 1], 1000 + idx + 1, 'lv' + (idx + 1))); row.appendChild(n); }
  const back = el('button', 'btn ghost', '选关'); back.type = 'button'; back.addEventListener('click', home);
  row.appendChild(back);
  card.appendChild(row);
  if (G.key.startsWith('daily')){ const lb = el('button', 'btn ghost', '🏆 今日排行榜'); lb.type = 'button'; lb.addEventListener('click', showBoard); card.appendChild(lb); }
  if (G.key.startsWith('daily')){ const sh = el('button', 'btn ghost', '复制成绩'); sh.type = 'button'; sh.addEventListener('click', () => copy(`塞行李箱 每日一箱 ${todayKey().slice(5).replace('-', '月')}日\n🧳 ${fmt(sec)} · ${G.items.length} 件 · 动了 ${G.moves} 次`)); card.appendChild(sh); }
  setTimeout(() => openModal(card), 500);
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function copy(t){ const fb = () => { const ta = el('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e){} ta.remove(); }; try { navigator.clipboard.writeText(t).then(() => toast('复制好了'), fb); } catch (e){ fb(); } }
function openModal(card){ const m = $('modal'); m.replaceChildren(card); m.hidden = false; }
function closeModal(){ $('modal').hidden = true; }
const showBoard = () => MiniBoard.show('', {title: '每日一箱排行榜', sub: `${todayKey().slice(5).replace('-', '月')}日 · 同一只箱子，只算今天第一次装完的用时`, empty: '装完今天的每日一箱就能上榜'});
function home(){
  closeModal();
  G = null;
  const card = $('homeCard');
  card.replaceChildren();
  card.append(el('h1', 'logo', '塞行李箱'), el('p', '', '明天出门，把床上的东西全塞进箱子'));
  const how = el('ul', 'how');
  for (const t of ['把东西从床上拖进箱子，格子对上就能放。', '点一下东西：可以转方向；衣服还能叠起来、卷起来，占的地方就小了。', '全塞进去就能合上箱子。猫跳进来的话，点它让它出去。']) how.appendChild(el('li', '', t));
  card.appendChild(how);
  const lv = el('div', 'levels');
  const dk = 'daily' + todayKey(), drec = store.get('rec:' + dk, null);
  const d = el('button', 'lv daily' + (drec ? ' done' : '')); d.type = 'button';
  d.append(el('b', '', '📅 每日一箱'), el('span', '', drec ? `今天用了 ${fmt(drec)}` : '每天一个新箱子，所有人同一题'));
  d.addEventListener('click', () => startLevel({name: '每日一箱', cols: 6, rows: 7, cat: true}, hashStr(dk), dk));
  const bb = el('button', 'lv daily'); bb.type = 'button';
  bb.append(el('b', '', '🏆 今日排行榜'), el('span', '', '每日一箱，比谁装得最快'));
  bb.addEventListener('click', showBoard);
  lv.appendChild(d);
  LEVELS.forEach((L, i) => {
    const rec = store.get('rec:lv' + i, null), open = i === 0 || store.get('rec:lv' + (i - 1), null) != null;
    const b = el('button', 'lv' + (rec ? ' done' : '')); b.type = 'button';
    b.append(el('b', '', `${i + 1}. ${L.name}`), el('span', '', rec ? `最快 ${fmt(rec)}` : open ? `${L.cols}×${L.rows} 的箱子` : '先过上一关'));
    b.disabled = !open;
    b.addEventListener('click', () => startLevel(L, 1000 + i, 'lv' + i));
    lv.appendChild(b);
  });
  lv.appendChild(bb);
  card.appendChild(lv);
  $('home').hidden = false;
}
$('btnBack').addEventListener('click', () => { Sound.click(); home(); });

/* ================= 每一帧 ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (G && !G.done && $('modal').hidden && $('home').hidden){ G.t += dt; $('time').textContent = fmt(Math.floor(G.t)); catTick(); }
  if (G) for (let k = G.fx.length - 1; k >= 0; k--){ const f = G.fx[k]; f.life -= dt; f.vy += 500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.r += dt * 8; if (f.life <= 0) G.fx.splice(k, 1); }
  draw(now);
  requestAnimationFrame(loop);
}

/* ================= 声音 ================= */
const Sound = (() => {
  let ac = null, out, nb;
  const A = {on: store.get('sound', true) !== false};
  A.unlock = () => { if (ac){ if (ac.state === 'suspended') ac.resume(); return; } try { ac = new (window.AudioContext || window.webkitAudioContext)(); out = ac.createGain(); out.gain.value = A.on ? .8 : 0; out.connect(ac.destination); nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch (e){} };
  const tone = (f, d = .3, g = .12, type = 'sine', t = 0, f2) => { if (!ac || !A.on) return; const t0 = ac.currentTime + t, o = ac.createOscillator(), e = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d); e.gain.setValueAtTime(.0001, t0); e.gain.linearRampToValueAtTime(g, t0 + .005); e.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(e); e.connect(out); o.start(t0); o.stop(t0 + d + .05); };
  const noise = (d, g, f1, f2, type = 'bandpass', t = 0) => { if (!ac || !A.on) return; const t0 = ac.currentTime + t, s = ac.createBufferSource(); s.buffer = nb; s.loop = true; const f = ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f1, t0); f.frequency.exponentialRampToValueAtTime(f2, t0 + d); const e = ac.createGain(); e.gain.setValueAtTime(.0001, t0); e.gain.linearRampToValueAtTime(g, t0 + .005); e.gain.exponentialRampToValueAtTime(.0001, t0 + d); s.connect(f); f.connect(e); e.connect(out); s.start(t0); s.stop(t0 + d + .05); };
  A.pick = () => tone(520, .08, .07, 'triangle', 0, 700);
  A.drop = () => { tone(300, .12, .12, 'sine', 0, 160); noise(.06, .08, 800, 400, 'lowpass'); };
  A.nope = () => { tone(220, .12, .1, 'square', 0, 180); tone(180, .15, .08, 'square', .1, 150); };
  A.fold = () => noise(.18, .1, 1500, 4000);
  A.click = () => tone(880, .05, .05, 'triangle');
  A.meow = () => { tone(700, .35, .07, 'sawtooth', 0, 900); tone(900, .25, .05, 'sawtooth', .2, 600); };
  A.zip = () => { for (let k = 0; k < 14; k++) noise(.03, .12, 3000, 2500, 'highpass', k * .04); tone(160, .15, .2, 'sine', .62, 90); };
  A.win = () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, .5, .08, 'triangle', k * .09));
  A.set = v => { A.on = v; store.set('sound', v); if (out) out.gain.value = v ? .8 : 0; };
  return A;
})();
$('btnSound').addEventListener('click', () => { Sound.unlock(); Sound.set(!Sound.on); $('btnSound').textContent = Sound.on ? '🔊' : '🔇'; });
$('btnSound').textContent = Sound.on ? '🔊' : '🔇';

/* ================= 开机 ================= */
try { await document.fonts.load('40px "ZCOOL KuaiLe"', '塞行李箱出发旅行指南薯片福每日一箱'); } catch (e){}
layout();
home();
requestAnimationFrame(loop);
if (['localhost', '127.0.0.1'].includes(location.hostname)) window.__p = {get G(){ return G; }, startLevel, LEVELS, generate, KINDS, itemCells, canPlace, layoutBed, updateUi, home, shoo, solve(){ for (const it of G.items){ it.s = it.sol.s; it.rot = it.sol.rot; it.place = {gx: it.sol.gx, gy: it.sol.gy}; } layoutBed(); updateUi(); }};
})();
</script>
